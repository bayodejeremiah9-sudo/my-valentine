<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Be My Valentine 💖</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #ff758c, #ff7eb3);
      font-family: 'Arial', sans-serif;
      text-align: center;
      color: white;
      overflow: hidden;
    }

    .card {
      background: rgba(255, 255, 255, 0.15);
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      max-width: 420px;
      position: relative;
    }

    h1 {
      font-size: 2.4em;
      margin-bottom: 10px;
    }

    p {
      font-size: 1.2em;
      margin-bottom: 30px;
    }

    button {
      padding: 12px 25px;
      font-size: 1.1em;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      margin: 10px;
      transition: all 0.2s ease;
      position: relative;
    }

    .yes {
      background: #fff;
      color: #ff4d6d;
      font-weight: bold;
    }

    .no {
      background: transparent;
      color: white;
      border: 2px solid white;
      position: absolute;
    }

    button:hover {
      transform: scale(1.1);
    }

    #response {
      margin-top: 25px;
      font-size: 1.4em;
      font-weight: bold;
      white-space: pre-wrap;
    }

    .hearts {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: hidden;
    }

    .heart {
      position: absolute;
      color: rgba(255,255,255,0.7);
      font-size: 20px;
      animation: float 6s linear infinite;
    }

    @keyframes float {
      0% {
        transform: translateY(100vh) scale(0.5);
        opacity: 1;
      }
      100% {
        transform: translateY(-10vh) scale(1.2);
        opacity: 0;
      }
    }

    /* Responsive tweaks */
    @media (max-width: 480px) {
      .card { padding: 24px; max-width: 320px; }
      h1 { font-size: 1.8em; }
      p { font-size: 1em; }
      .heart { font-size: 16px; }
    }
  </style>
</head>
<body>

  <div class="card" id="card">
    <h1>Hey My Milkshakes 💕</h1>
    <p>Every day with you is special…<br>Will you be my Valentine? 💖</p>

    <button class="yes" id="yesBtn" onclick="sayYes()">Yes 💘</button>
    <button class="no" id="noBtn">No 🙈</button>

    <div id="response"></div>
  </div>

  <div class="hearts" id="hearts"></div>

  <!-- Hidden YouTube player; playback will start after user presses Yes -->
  <div id="player" style="width:0;height:0;overflow:hidden;position:absolute;left:-9999px;"></div>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    // YouTube player setup
    let player;
    function onYouTubeIframeAPIReady() {
      player = new YT.Player('player', {
        height: '0',
        width: '0',
        videoId: 'XMMP-T3EF8s',
        playerVars: { 'playsinline': 1, 'rel': 0, 'controls': 0 },
      });
    }

    function sayYes() {
      // Exact response per request
      document.getElementById("response").textContent = "YAY!!! 💖💖💖 I’m the luckiest person alive 😍";
      createHearts();

      // Start playback — this is a user gesture so browsers should allow it
      if (player && typeof player.playVideo === 'function') {
        try { player.playVideo(); } catch (e) { console.warn('Player not ready', e); }
      }
    }

    // Constrain the No button to stay inside the card
    const noBtn = document.getElementById("noBtn");
    const card = document.getElementById("card");

    noBtn.addEventListener("mouseover", () => {
      const cardRect = card.getBoundingClientRect();
      const btnWidth = noBtn.offsetWidth;
      const btnHeight = noBtn.offsetHeight;

      const x = Math.random() * (cardRect.width - btnWidth);
      const y = Math.random() * (cardRect.height - btnHeight - 10) + 10; // keep a small margin

      noBtn.style.left = (cardRect.left + x - cardRect.left) + "px";
      noBtn.style.top = y + "px";
      noBtn.style.position = 'absolute';
    });

    function createHearts() {
      const heartsContainer = document.getElementById("hearts");
      for (let i = 0; i < 30; i++) {
        const heart = document.createElement("div");
        heart.className = "heart";
        heart.innerHTML = "💖";
        heart.style.left = Math.random() * 100 + "vw";
        heart.style.animationDuration = 3 + Math.random() * 3 + "s";
        heartsContainer.appendChild(heart);

        setTimeout(() => heart.remove(), 6000);
      }
    }
  </script>
</body>
</html>
